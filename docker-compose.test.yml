version: "3.8"

# Own Compose project name: without it this file shares the "notificationsystem"
# project with docker-compose.yml, so `down -v` here would tear down the main
# stack (containers + SQL volume) too.
name: notificationsystem-test

# Isolated, fail-fast SQL for tests. No named volume — a leftover
# notificationsystem-sql volume must never be reused here.
# This compose file is intentionally SQL-only — it provides a clean
# database instance for integration tests. App services are not
# included; tests connect to this SQL Server directly.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: test-rabbitmq
    # Host-published because the integration tests run on the host, not in the compose
    # network. 5672 is owned by the main stack, so the test broker uses 5673/15673.
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      # jose_server must be disabled or this container intermittently fails to boot.
      # The image ships OpenSSL 3.1.8 with only the `default` provider active (no `legacy`),
      # and JOSE's elliptic-curve key check needs `legacy`. When it fails, RabbitMQ's
      # supervision tree tears down the whole application:
      #   exception exit: {{shutdown,{failed_to_start_child,jose_server,terminating}},
      #                    {jose_app,start,[normal,[]]}}
      # Combined with restart: "no" below, a single crash leaves the broker permanently down
      # and nothing listening on the published port. Nothing in this repo's tests exercises
      # OAuth2 token validation, so JOSE is not needed here.
      # Do not "clean this up" - re-adding the plugin means fixing the OpenSSL provider gap.
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_jose disable
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      # RabbitMQ needs roughly 30s to finish its Erlang boot and report "Server startup
      # complete". Without a start_period, interval x retries is the entire grace budget and a
      # healthy-but-still-starting broker is reported unhealthy. sqlserver has one too.
      start_period: 60s
    restart: "no"
