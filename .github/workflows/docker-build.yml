name: Build and Push Docker Images

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ahmadmdabit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build NotificationSystem.slnx -c Debug

      - name: Run architecture tests
        run: dotnet test Tests/ArchitectureTests/ArchitectureTests.csproj -c Debug --no-build

      - name: Run wiring tests
        run: dotnet test Tests/WiringTests/WiringTests.csproj -c Debug --no-build

      # Integration tests need a REAL broker. They deliberately fail rather than skip when
      # one is absent, so the broker must be up before this step - otherwise CI would fail on
      # a missing dependency and a developer without Docker would see a red suite.
      - name: Start test broker
        run: docker compose -f docker-compose.test.yml up -d --wait rabbitmq

      - name: Run integration tests
        run: dotnet test Tests/IntegrationTests/IntegrationTests.csproj -c Debug --no-build

      - name: Stop test broker
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.test.yml config -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: userservice
            dockerfile: Services/UserService/Dockerfile
          - service: notificationservice
            dockerfile: Services/NotificationService/Dockerfile
          - service: apigateway
            dockerfile: Services/ApiGateway/Dockerfile
          - service: ui
            dockerfile: Presentation/UI/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/notificationsystem-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/notificationsystem-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max