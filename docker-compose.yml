services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notificationsystem-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notificationsystem-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER is required (remote guest logins are refused by the broker)}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  userservice:
    build:
      context: .
      dockerfile: Services/UserService/Dockerfile
    container_name: notificationsystem-userservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=UserDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      # MassTransit 8.5.10 needs no licence key, so there is nothing to mount here. The 9.x
      # licence apparatus - MT_LICENSE_PATH plus a read-only bind of
      # ~/.dotnet/MassTransit/license.txt - was removed with the downgrade. It also blocked `up` on
      # any host without that file, because of create_host_path: false.
      - Messaging__UseRabbitMq=true
      # Set MESSAGING_ENABLED=false to run with no bus at all; NullDomainEventDispatcher then
      # drops domain events instead of publishing them. Not a deployment mode.
      - Messaging__Enabled=${MESSAGING_ENABLED:-true}
      - Messaging__RabbitMq__Host=rabbitmq
      - Messaging__RabbitMq__Username=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - Messaging__RabbitMq__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  notificationservice:
    build:
      context: .
      dockerfile: Services/NotificationService/Dockerfile
    container_name: notificationsystem-notificationservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=NotificationDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      # MassTransit 8.5.10 needs no licence key - see the userservice block above.
      - Messaging__UseRabbitMq=true
      # Set MESSAGING_ENABLED=false to run with no bus at all; NullDomainEventDispatcher then
      # drops domain events instead of publishing them. Not a deployment mode.
      - Messaging__Enabled=${MESSAGING_ENABLED:-true}
      - Messaging__RabbitMq__Host=rabbitmq
      - Messaging__RabbitMq__Username=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - Messaging__RabbitMq__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  apigateway:
    build:
      context: .
      dockerfile: Services/ApiGateway/Dockerfile
    container_name: notificationsystem-apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8081:8080"
    healthcheck:
      # Gateway exposes /health (see its Dockerfile HEALTHCHECK); keeps ui's
      # service_healthy dependency satisfiable without depending on upstreams.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      userservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Presentation/UI/Dockerfile
    container_name: notificationsystem-ui
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__GatewayBaseUrl=http://apigateway:8080
      - ApiSettings__ServiceUsername=uiservice
      - ApiSettings__ServicePassword=${UI_SERVICE_PASSWORD:?UI_SERVICE_PASSWORD is required}
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8080:8080"
    depends_on:
      apigateway:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  backend:
    driver: bridge
    name: notificationsystem
