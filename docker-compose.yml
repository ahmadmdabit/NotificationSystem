version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notificationsystem-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  userservice:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: notificationsystem-userservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=UserDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  notificationservice:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    container_name: notificationsystem-notificationservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=NotificationDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: notificationsystem-apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Ocelot__AdministrationToken=${ADMIN_TOKEN:-}
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8081:8080"
    depends_on:
      userservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: UI/Dockerfile
    container_name: notificationsystem-ui
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__GatewayBaseUrl=http://apigateway:8080
      - ApiSettings__ServiceUsername=uiservice
      - ApiSettings__ServicePassword=${UI_SERVICE_PASSWORD:?UI_SERVICE_PASSWORD is required}
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8080:8080"
    depends_on:
      apigateway:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  backend:
    driver: bridge
    name: notificationsystem
