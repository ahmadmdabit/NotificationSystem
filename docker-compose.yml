services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notificationsystem-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notificationsystem-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER is required (remote guest logins are refused by the broker)}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  userservice:
    build:
      context: .
      dockerfile: Services/UserService/Dockerfile
    container_name: notificationsystem-userservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=UserDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - Messaging__UseRabbitMq=true
      # Set MESSAGING_ENABLED=false to run with no bus at all (NullDomainEventDispatcher drops
      # events). Requires a valid MassTransit licence when true - see .env.example.
      - Messaging__Enabled=${MESSAGING_ENABLED:-true}
      # MassTransit 9.x is commercially licensed and refuses to create a bus without a key.
      # The key is read from a file mounted read-only below; it must never appear in an ENV,
      # ARG, Dockerfile layer or appsettings. Host path is overridable via MASSTRANSIT_LICENSE_FILE.
      - MT_LICENSE_PATH=/masstransit/license.txt
      - Messaging__RabbitMq__Host=rabbitmq
      - Messaging__RabbitMq__Username=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - Messaging__RabbitMq__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      # MassTransit licence key, read-only. Source path is overridable; default is the
      # documented per-user location. This file is NEVER committed.
      #
      # Long syntax with create_host_path: false (N-09). The short syntax silently CREATES A
      # DIRECTORY at the source path when it is missing, so a licence-less host turned the
      # documented "License must be specified" into an opaque mount failure. Compose now fails
      # fast with a clear "source path does not exist" instead. Because the mount is
      # unconditional, create the file before the first `up`:
      #   mkdir -p ~/.dotnet/MassTransit && touch ~/.dotnet/MassTransit/license.txt
      # This is irrelevant when MESSAGING_ENABLED=false - the bus is never registered and the
      # file is never read - but the file must exist for `up` to succeed either way.
      - type: bind
        source: ${MASSTRANSIT_LICENSE_FILE:-${HOME}/.dotnet/MassTransit/license.txt}
        target: /masstransit/license.txt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  notificationservice:
    build:
      context: .
      dockerfile: Services/NotificationService/Dockerfile
    container_name: notificationsystem-notificationservice
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - DISABLE_HTTPS_REDIRECT=true
      - AppSettings__SqlConnectionString=Server=sqlserver;Database=NotificationDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - Messaging__UseRabbitMq=true
      # Set MESSAGING_ENABLED=false to run with no bus at all (NullDomainEventDispatcher drops
      # events). Requires a valid MassTransit licence when true - see .env.example.
      - Messaging__Enabled=${MESSAGING_ENABLED:-true}
      # MassTransit 9.x is commercially licensed and refuses to create a bus without a key.
      # The key is read from a file mounted read-only below; it must never appear in an ENV,
      # ARG, Dockerfile layer or appsettings. Host path is overridable via MASSTRANSIT_LICENSE_FILE.
      - MT_LICENSE_PATH=/masstransit/license.txt
      - Messaging__RabbitMq__Host=rabbitmq
      - Messaging__RabbitMq__Username=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - Messaging__RabbitMq__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      # MassTransit licence key, read-only. Source path is overridable; default is the
      # documented per-user location. This file is NEVER committed.
      #
      # Long syntax with create_host_path: false (N-09). The short syntax silently CREATES A
      # DIRECTORY at the source path when it is missing, so a licence-less host turned the
      # documented "License must be specified" into an opaque mount failure. Compose now fails
      # fast with a clear "source path does not exist" instead. Because the mount is
      # unconditional, create the file before the first `up`:
      #   mkdir -p ~/.dotnet/MassTransit && touch ~/.dotnet/MassTransit/license.txt
      # This is irrelevant when MESSAGING_ENABLED=false - the bus is never registered and the
      # file is never read - but the file must exist for `up` to succeed either way.
      - type: bind
        source: ${MASSTRANSIT_LICENSE_FILE:-${HOME}/.dotnet/MassTransit/license.txt}
        target: /masstransit/license.txt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  apigateway:
    build:
      context: .
      dockerfile: Services/ApiGateway/Dockerfile
    container_name: notificationsystem-apigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8081:8080"
    healthcheck:
      # Gateway exposes /health (see its Dockerfile HEALTHCHECK); keeps ui's
      # service_healthy dependency satisfiable without depending on upstreams.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      userservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Presentation/UI/Dockerfile
    container_name: notificationsystem-ui
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__GatewayBaseUrl=http://apigateway:8080
      - ApiSettings__ServiceUsername=uiservice
      - ApiSettings__ServicePassword=${UI_SERVICE_PASSWORD:?UI_SERVICE_PASSWORD is required}
      - DISABLE_HTTPS_REDIRECT=true
    ports:
      - "8080:8080"
    depends_on:
      apigateway:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  backend:
    driver: bridge
    name: notificationsystem
